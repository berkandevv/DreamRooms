services:
  app:
    build:
      context: ./backend
      dockerfile: ../php.Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: laravel-app
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
    networks:
      - laravel-net

  web:
    image: nginx:alpine
    container_name: laravel-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel-net

  frontend:
    image: node:20-alpine
    container_name: vite-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "[ -f node_modules/.bin/vite ] || npm ci; npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - laravel-net
    depends_on:
      - web

  backend-vite:
    image: node:20-alpine
    container_name: vite-backend
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -lc "[ -f node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    networks:
      - laravel-net
    depends_on:
      - web

  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-net

networks:
  laravel-net:
    driver: bridge

volumes:
  db_data:
  frontend_node_modules:
  backend_node_modules:
