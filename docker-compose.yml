name: dreamrooms

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../php.Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: dreamrooms-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: dreamrooms-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - internal

  frontend:
    image: node:22-alpine
    container_name: dreamrooms-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -lc "[ -f node_modules/.bin/vite ] || npm ci; npx vite --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    networks:
      - internal
    depends_on:
      - nginx

  backend-vite:
    image: node:22-alpine
    container_name: dreamrooms-backend-vite
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -lc "[ -f node_modules/.bin/vite ] || npm ci; npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    networks:
      - internal
    depends_on:
      - nginx

  database:
    image: mysql:8.0
    container_name: dreamrooms-database
    restart: unless-stopped
    command: --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dreamrooms
      MYSQL_USER: dreamrooms
      MYSQL_PASSWORD: dreamrooms
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  database_data:
  frontend_node_modules:
  backend_node_modules:
