server {
    listen 80;
    server_name localhost;

    root /var/www/public;
    index index.php;

    # Sirve ficheros estáticos y, si no existen, delega en el router de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pasa la ejecución de PHP al contenedor backend (PHP-FPM) por FastCGI
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea ficheros ocultos salvo /.well-known (certificados, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
